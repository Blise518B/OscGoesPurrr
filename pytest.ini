[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
filterwarnings =
    error
    # websocket-client (used by the standalone testbench, not the app)
    # emits DeprecationWarnings on some Python versions. Scoped narrowly
    # so every other warning still fails the suite.
    ignore::DeprecationWarning:websocket
