[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
filterwarnings =
    error
    ignore::DeprecationWarning:websocket
    # bleak's WinRT backend (Coyote BLE) emits DeprecationWarnings on some
    # Windows/Python combos. Scoped narrowly, like the websocket exception
    # above, so every other warning still fails the suite.
    ignore::DeprecationWarning:bleak
