<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OscGoesPurrr web remote</title>
<!--
  The web remote: drive someone's toys from a browser, no OGP installed.
  Opens their web remote link (remote.html#<id>.<code>.<nick>, made by
  src/friend_links.py); assets/remote.js dials that OGP over iroh in
  WebAssembly (tools/web_guest) and speaks the Friends protocol as a web
  guest - toys only. Everything after the # stays in the browser.

  Colours are tokens from assets/tokens.css, never a new hex.
-->
<meta name="robots" content="noindex">
<meta name="description" content="Drive a friend's toys from your browser, through OscGoesPurrr.">
<meta name="theme-color" content="#0a0c0a">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" href="assets/ogp-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/tokens.css">
<style>
@font-face {
  font-family: "Aldrich Site";
  src: url("assets/fonts/Aldrich-Regular.ttf") format("truetype");
  font-display: swap;
}
:root { --title-font: "Aldrich Site", "Segoe UI", sans-serif; }
body {
  font-size: 16px; line-height: 1.5; background: var(--bg); color: var(--txt);
  min-height: 100vh; display: flex; justify-content: center; padding: 24px 16px;
}
.card {
  width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-card); padding: 26px 24px; align-self: flex-start;
}
.head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.mark { width: 48px; height: 48px; flex: none; }
.eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
h1 { font-family: var(--title-font); font-weight: 400; font-size: 24px; line-height: 1.2; margin: 2px 0 0; }
h1 .who { color: var(--cyan); }
p { margin: 0 0 12px; color: var(--muted); }
form { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
label { width: 100%; font-size: 13px; color: var(--dim); }
input[type=text] {
  flex: 1; min-width: 0; font: inherit; color: var(--txt); background: var(--well);
  border: 1px solid var(--line); border-radius: var(--r-in); padding: 10px 12px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; cursor: pointer;
  font: inherit; font-weight: 650; font-size: 16px; padding: 10px 20px; border-radius: 10px;
  border: 1px solid var(--line); color: var(--txt); background: transparent;
}
.btn:hover { border-color: var(--accent); color: var(--accent); background: var(--hover); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.btn-primary:hover { background: var(--accent2); border-color: var(--accent2); color: var(--ink); }
.btn-stop { width: 100%; margin-top: 14px; background: var(--red-tint); border-color: var(--red); color: var(--red); }
.btn-stop:hover { background: var(--red-mid); border-color: var(--red); color: var(--txt); }
.state { font-size: 14px; padding: 8px 12px; border-radius: var(--r-btn); background: var(--well); color: var(--muted); }
.state.ok { color: var(--accent); background: var(--tint); }
.state.bad { color: var(--warn); background: var(--warn-tint); }
.state.ok::before, .state.connecting::before {
  content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 8px; vertical-align: 1px; background: currentColor;
}
.state.ok::before { box-shadow: var(--glow) var(--accent); }
.state.connecting::before { background: var(--dim); }
.me { font-size: 13px; color: var(--dim); margin: 8px 0 0; }
#panel { margin-top: 16px; }
.section { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 8px; }
.section h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--pink); margin: 0; }
.section .strength { font-size: 13px; color: var(--dim); }
.note { font-size: 14px; color: var(--warn); margin: 0 0 10px; }
.toy {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
  padding: 12px 14px; margin-bottom: 8px; border-radius: var(--r-btn);
  background: var(--pink-tint); border: 1px solid var(--pink-mid);
}
.toy.all { background: var(--panel); border-color: var(--line); }
.toy.off { opacity: .5; }
.toy .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toy .value { font-variant-numeric: tabular-nums; color: var(--pink); font-weight: 650; }
.toy.all .value { color: var(--accent); }
/* the app's groove + round handle (as in assets/demo.css), not the browser's own:
   at 0 and 100 the handle sits right at the ends */
.toy input[type=range] {
  -webkit-appearance: none; appearance: none; background: transparent; margin: 0; padding: 0;
  border: none; outline: none; box-shadow: none; grid-column: 1 / -1; width: 100%; height: 28px; cursor: pointer; --v: 0%; --fill: var(--pink);
}
.toy.all input[type=range] { --fill: var(--accent); }
.toy input[type=range]::-webkit-slider-runnable-track {
  height: 12px; border: 1px solid var(--line); border-radius: 7px;
  background: linear-gradient(90deg, var(--fill) var(--v), var(--well) var(--v));
}
.toy input[type=range]::-moz-range-track {
  height: 10px; border: 1px solid var(--line); border-radius: 7px;
  background: linear-gradient(90deg, var(--fill) var(--v), var(--well) var(--v));
}
.toy input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 24px; height: 24px; border-radius: 12px; margin-top: -7px;
  background: var(--fill); border: none;
}
.toy input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 12px; background: var(--fill); border: none; }
.toy input[type=range]:focus-visible { outline: 2px solid var(--fill); outline-offset: 3px; border-radius: 8px; }
.live { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--pink-mid); overflow: hidden; }
.live > span { display: block; height: 100%; width: 0; background: var(--pink); transition: width .1s linear; }
details { margin-top: 18px; }
summary { font-size: 13px; color: var(--dim); cursor: pointer; }
#log { font-family: var(--mono); font-size: 12px; color: var(--dim); max-height: 180px; overflow: auto;
  background: var(--well); border-radius: var(--r-btn); padding: 8px 10px; margin-top: 6px; }
.bad { color: var(--warn); }
.foot { margin: 18px 0 0; font-size: 12px; color: var(--dim); text-align: center; }
.foot a { color: var(--dim); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <div class="head">
    <img class="mark" src="assets/ogp-icon.svg" alt="">
    <div>
      <div class="eyebrow">OscGoesPurrr web remote</div>
      <h1><span class="who" id="who">A friend</span>'s toys</h1>
    </div>
  </div>

  <div id="ok" hidden>
    <form id="go">
      <label for="nick">Your name, as they'll see it</label>
      <input type="text" id="nick" maxlength="24" placeholder="Web guest" autocomplete="nickname">
      <button class="btn btn-primary" type="submit">Connect</button>
    </form>
    <div class="state connecting" id="state">Not connected</div>
    <p class="me" id="me"></p>

    <div id="panel" hidden>
      <div class="section">
        <h2>Toys</h2>
        <span class="strength" id="strength"></span>
      </div>
      <p class="note" id="note" hidden></p>
      <div id="toys"></div>
      <button class="btn btn-stop" id="stop" type="button">Stop all</button>
    </div>

    <details>
      <summary>Link log</summary>
      <div id="log"></div>
    </details>
  </div>

  <div id="broken" hidden>
    <h1 class="bad">Broken link</h1>
    <p>Ask your friend for a new one.</p>
  </div>
  <p class="foot"><a href="./">OscGoesPurrr</a> · <a href="assets/web_guest/THIRD_PARTY_NOTICES.txt">Licenses</a></p>
</main>
<script type="module" src="assets/remote.js"></script>
</body>
</html>
