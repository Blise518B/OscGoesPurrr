<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OscGoesPurrr friend invite</title>
<!--
  The page an OGP invite link opens (src/friend_links.py makes the links).
  Discord only makes http(s) links clickable, so the app copies
  friend.html#<id>.<code>.<nick>; this page hands that on to the app as
  ogp://friend/<id>.<code>.<nick>, which the app registered for itself
  (src/link_scheme.py). Everything after the # stays in the browser:
  GitHub's server never sees who invited whom.

  Colours are tokens from assets/tokens.css, never a new hex.
-->
<meta name="robots" content="noindex">
<meta name="description" content="An invite to link up on OscGoesPurrr Friends.">
<meta name="theme-color" content="#0a0c0a">
<meta property="og:type" content="website">
<meta property="og:title" content="OscGoesPurrr friend invite">
<meta property="og:description" content="Click to link up in OscGoesPurrr: you can drive each other's toys over the internet.">
<meta property="og:image" content="https://blise518b.github.io/OscGoesPurrr/assets/og-card.png">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" href="assets/ogp-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/tokens.css">
<style>
@font-face {
  font-family: "Aldrich Site";
  src: url("assets/fonts/Aldrich-Regular.ttf") format("truetype");
  font-display: swap;
}
:root { --title-font: "Aldrich Site", "Segoe UI", sans-serif; }
body {
  font-size: 16px; line-height: 1.6; background: var(--bg); color: var(--txt);
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
}
.card {
  width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-card); padding: 30px 28px; text-align: center;
}
.mark { width: 64px; height: 64px; margin: 0 auto 14px; display: block; }
.eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
h1 { font-family: var(--title-font); font-weight: 400; font-size: 26px; line-height: 1.2; margin: 8px 0 18px; }
h1 .who { color: var(--cyan); }
p { margin: 0 0 12px; color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
  font-weight: 650; font-size: 16px; padding: 12px 22px; border-radius: 10px;
  border: 1px solid var(--line); color: var(--txt); margin: 6px 4px 0;
}
.btn:hover { border-color: var(--accent); color: var(--accent); background: var(--hover); text-decoration: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.btn-primary:hover { background: var(--accent2); border-color: var(--accent2); color: var(--ink); }
.steps { margin: 22px 0 0; padding: 14px 16px 16px; background: var(--well); border-radius: var(--r-btn); }
.steps h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 0 0 4px; }
.small { font-size: 13px; color: var(--dim); margin: 10px 0 0; }
.bad { color: var(--warn); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <img class="mark" src="assets/ogp-icon.svg" alt="">
  <div class="eyebrow">OscGoesPurrr Friends</div>

  <div id="ok" hidden>
    <h1><span class="who" id="who">A friend</span> invited you</h1>
    <a class="btn btn-primary" id="open" href="#">Open in OscGoesPurrr</a>
    <p class="small">Starts the app if it isn't running.</p>
    <div class="steps">
      <h2>Not installed?</h2>
      <a class="btn" href="https://github.com/Blise518B/OscGoesPurrr/releases/latest/download/OscGoesPurrr-Windows.exe">Windows</a>
      <a class="btn" href="https://github.com/Blise518B/OscGoesPurrr/releases/latest/download/OscGoesPurrr-Linux-x86_64.AppImage">Linux</a>
      <p class="small">Start it once, then click the invite again.</p>
    </div>
  </div>

  <div id="broken" hidden>
    <h1 class="bad">Broken invite link</h1>
    <p>Ask your friend for a new one.</p>
    <a class="btn" href="./">What is OscGoesPurrr?</a>
  </div>
</main>
<script>
(function () {
  "use strict";
  // <id>.<code>.<nick> -- the same shape src/friend_links.py writes and parses.
  // The nick is percent-encoded, so it ends at the first character that
  // encoding never writes: a browser that joins the copied link with the
  // line under it -- "(Add Blise on OscGoesPurrr)" -- hands that over too.
  var parts = location.hash.replace(/^#/, "").split(".");
  var id = (parts[0] || "").toLowerCase();
  var code = (parts[1] || "").toLowerCase();
  var nickRaw = parts.slice(2).join(".").split(/[^A-Za-z0-9_.~%-]/)[0];
  var nick = "";
  try { nick = decodeURIComponent(nickRaw); } catch (e) { nick = ""; }
  nick = nick.replace(/\s+/g, " ").trim().slice(0, 24);

  if (!/^[0-9a-f]{64}$/.test(id) || !/^[0-9a-f]{16}$/.test(code)) {
    document.getElementById("broken").hidden = false;
    return;
  }
  document.getElementById("ok").hidden = false;
  if (nick) {
    document.getElementById("who").textContent = nick;
    document.title = nick + " invited you - OscGoesPurrr";
  }
  // encoded the way Python's quote() does (! ' ( ) * too), so the app
  // reads the nickname by the same rule
  var nickOut = encodeURIComponent(nick).replace(/[!'()*]/g, function (c) {
    return "%" + c.charCodeAt(0).toString(16).toUpperCase();
  });
  var app = "ogp://friend/" + id + "." + code + "." + nickOut;
  var open = document.getElementById("open");
  open.href = app;
  // Straight on to the app; the browser asks first whether to open it.
  location.href = app;
})();
</script>
</body>
</html>
