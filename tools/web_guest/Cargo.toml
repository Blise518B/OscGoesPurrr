[package]
name = "ogp_web_guest"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "The browser's end of an OGP link: iroh in WebAssembly, datagrams only"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The same iroh the Python bindings carry (iroh 1.2.0 on PyPI is iroh 1.4.1)
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
bytes = "1"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "0.4"

[profile.release]
codegen-units = 1
strip = "symbols"
debug = false
lto = true
opt-level = "z"
panic = "abort"
